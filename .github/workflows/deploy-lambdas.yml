name: Deploy Lambdas

on:
  push:
    branches: ["main"]
    paths:
     - "lambda_augment/**"
     - "lambda_retrieve/**"
     - "lambda_repo_sync_index/**"
     - "context_graph/**"
     - "vendor/codebase_memory_pipeline/**"
     - "pyproject.toml"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to deploy"
        required: true
        type: choice
        options: ["dev", "prod"]

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: "Build deploy matrix (push: dev+prod, manual: selected env)"
        id: set
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.inputs.env' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            env="$(jq -r '.inputs.env' "$GITHUB_EVENT_PATH")"
            echo "matrix={\"env\":[\"${env}\"]}" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"env":["dev","prod"]}' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy (${{ matrix.env }})
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # GitHub repo secret like: arn:aws:iam::<account-id>:role/github-actions-oidc
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gha-deploy-lambdas-${{ github.run_id }}-${{ matrix.env }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambdas
        shell: bash
        run: |
          set -euo pipefail
          rm -f augment.zip retrieve.zip
          (cd lambda_augment && zip -r ../augment.zip .)
          (cd lambda_retrieve && zip -r ../retrieve.zip .)

      - name: Resolve account registry
        id: account
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${{ steps.account.outputs.registry }}"

      - name: Deploy augment Lambda
        shell: bash
        run: |
          set -euo pipefail
          env="${{ matrix.env }}"
          aws lambda update-function-code \
            --function-name "context-graph-${env}-augment" \
            --zip-file "fileb://augment.zip"

      - name: Deploy retrieve Lambda
        shell: bash
        run: |
          set -euo pipefail
          env="${{ matrix.env }}"
          aws lambda update-function-code \
            --function-name "context-graph-${env}-retrieve" \
            --zip-file "fileb://retrieve.zip"

      - name: Build and push repo-sync-index image
        shell: bash
        run: |
          set -euo pipefail
          env="${{ matrix.env }}"
          image_uri="${{ steps.account.outputs.registry }}/context-graph-${env}-repo-sync-index:latest"
          docker build -f lambda_repo_sync_index/Dockerfile -t "${image_uri}" .
          docker push "${image_uri}"
          if aws lambda get-function --function-name "context-graph-${env}-repo-sync-index" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "context-graph-${env}-repo-sync-index" \
              --image-uri "${image_uri}"
          else
            echo "repo-sync-index Lambda does not exist yet; image pushed to ${image_uri}"
          fi
