name: Deploy MCP Server

on:
  push:
    branches: ["main"]
    paths:
      - "mcp_server/**"
      - "context_graph/**"
      - "scripts/deploy-mcp.sh"
      - "infra/**"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to deploy"
        required: true
        type: choice
        options: ["dev", "prod"]

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build deploy matrix
        id: set
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.inputs.env' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            env="$(jq -r '.inputs.env' "$GITHUB_EVENT_PATH")"
            echo "matrix={\"env\":[\"${env}\"]}" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"env":["dev","prod"]}' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy (${{ matrix.env }})
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gha-deploy-mcp-${{ github.run_id }}-${{ matrix.env }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy MCP server
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy-mcp.sh --env "${{ matrix.env }}"
