name: Test Coverage

on:
  push:
    branches: ["main", "repo-indexing"]
    paths:
      - "context_graph/**"
      - "mcp_server/**"
      - "tests/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "README.md"
      - ".github/workflows/test-coverage.yml"
      - ".github/scripts/render_coverage_badge.py"
  pull_request:
    paths:
      - "context_graph/**"
      - "mcp_server/**"
      - "tests/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "README.md"
      - ".github/workflows/test-coverage.yml"
      - ".github/scripts/render_coverage_badge.py"

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages --dev --no-editable

      - name: Run package tests with combined coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -f .coverage coverage.xml coverage-report.txt
          uv run python -m pytest \
            tests \
            --cov=context_graph \
            --cov-report=
          PYTHONPATH=mcp_server uv run python -m pytest \
            mcp_server/tests \
            --cov=mcp_server/src \
            --cov-append \
            --cov-report=
          uv run coverage xml -o coverage.xml
          uv run coverage report | tee coverage-report.txt

      - name: Verify standalone MCP package entrypoints
        run: |
          PYTHONPATH=mcp_server uv run python -m src --help
          PYTHONPATH=mcp_server uv run python -c "from src.bootstrap import main; print(callable(main))"

      - name: Render coverage badge
        run: |
          uv run python .github/scripts/render_coverage_badge.py \
            --coverage-xml coverage.xml \
            --output badges/coverage.svg

      - name: Build PR coverage comment
        if: github.event_name == 'pull_request'
        run: |
          COVERAGE_PERCENT=$(python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          print(round(float(root.attrib.get("line-rate", "0")) * 100))
          PY
          )
          {
            echo "## Combined Project Coverage"
            echo
            echo "Coverage across \`context_graph\` and \`mcp_server/src\`: ${COVERAGE_PERCENT}%"
            echo
            echo '```text'
            cat coverage-report.txt
            echo '```'
          } > coverage-comment.md

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage-comment.md

      - name: Commit updated coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- badges/coverage.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          git push
