services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: context-graph-postgres
    environment:
      POSTGRES_DB: context_graph
      POSTGRES_USER: context_graph
      POSTGRES_PASSWORD: context_graph
    ports:
      - "5433:5432"
    volumes:
      - context_graph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_graph -d context_graph"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: context-graph-neo4j
    environment:
      NEO4J_AUTH: neo4j/contextgraph
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - context_graph_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  context_graph_postgres_data:
  context_graph_neo4j_data:
