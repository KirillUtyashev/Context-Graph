# Graphiti MCP Server — Amazon Neptune + AWS Bedrock configuration
#
# Deployment:
#   On the EC2 instance, set CONFIG_PATH to point to this file:
#     Environment=CONFIG_PATH=/opt/mcp_server/current/config/config-neptune-bedrock.yaml
#
# All ${VAR} references are expanded from environment variables at startup.
# Set NEPTUNE_HOST in the systemd unit (see infra/modules/mcp_ec2/main.tf).

server:
  transport: http
  host: 0.0.0.0
  port: ${PORT:8000}

llm:
  provider: bedrock
  # Cross-region inference profile IDs required for Claude in ca-central-1.
  # Direct model IDs (anthropic.claude-sonnet-4-6) are not supported on-demand
  # in ca-central-1 without a cross-region inference profile.
  model: "us.anthropic.claude-sonnet-4-6"
  small_model: "us.anthropic.claude-sonnet-4-6"
  # Temperature uses the bedrock client default (1.0) when not set.
  max_tokens: 8192

embedder:
  # Amazon Titan Embeddings v2 — no Marketplace subscription required.
  # Cohere embed-english-v3 requires a Bedrock Marketplace subscription acceptance
  # in the console; use bedrock_cohere + model: "cohere.embed-english-v3" once subscribed.
  provider: bedrock_titan
  model: "amazon.titan-embed-text-v2:0"
  dimensions: 1024

database:
  provider: neptune
  providers:
    neptune:
      # Neptune cluster endpoint — injected via NEPTUNE_HOST env var at runtime.
      # Format: neptune-db://<cluster-endpoint>
      # The NEPTUNE_HOST env var overrides this value (see DatabaseDriverFactory).
      host: ${NEPTUNE_HOST}
      # AOSS host for BM25/keyword search. Leave unset to use semantic+graph only.
      # Uncomment and set when an OpenSearch Serverless collection is available:
      # aoss_host: ${AOSS_HOST}

graphiti:
  group_id: main
  user_id: mcp_user
