[project]
name = "context-graph-mcp"
version = "0.1.0"
description = "Standalone MCP server app for Context Graph"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "context-graph",
    "mcp>=1.9,<2",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    "starlette>=0.41,<1",
]

[project.scripts]
context-graph-mcp = "context_graph_mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
]

[tool.uv.sources]
context-graph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_graph_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
