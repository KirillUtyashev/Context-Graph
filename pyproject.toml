[project]
name = "context-graph"
version = "0.1.0"
requires-python = ">=3.10,<4"
dependencies = [
    # Local editable fork of graphiti-core with neptune + bedrock support
    "graphiti-core[neptune]",
    # Context-graph pipeline deps (previously in context_graph/requirements-local.txt)
    "neo4j>=5.22,<6",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
]

[tool.uv.sources]
graphiti-core = { path = "./vendor/graphiti", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["context_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["context_graph"]
omit = [
    "context_graph/cli.py",
    "context_graph/entity_nodes.py",
    "context_graph/episodes.py",
    "context_graph/graph_read.py",
    "context_graph/metadata.py",
    "context_graph/profile_vectors.py",
    "context_graph/profiles.py",
    "context_graph/memory/**",
    "context_graph/provenance/**",
    "context_graph/server/**",
    "context_graph/runtime/embedding/**",
    "context_graph/runtime/llm/bedrock_client.py",
    "context_graph/runtime/llm/client.py",
    "context_graph/runtime/llm/openai_base_client.py",
    "context_graph/runtime/llm/openai_client.py",
    "context_graph/runtime/providers/**",
    "context_graph/storage/backend/__init__.py",
    "context_graph/storage/backend/driver.py",
    "context_graph/storage/backend/factory.py",
    "context_graph/storage/backend/maintenance.py",
    "context_graph/storage/backend/metadata/**",
    "context_graph/storage/backend/neo4j/**",
    "context_graph/storage/backend/neptune/**",
    "context_graph/storage/backend/profile_vectors/**",
    "context_graph/storage/backend/query_executor.py",
    "context_graph/storage/backend/search.py",
    "context_graph/storage/backend/sync_bridge.py",
    "context_graph/storage/backend/traversal.py",
    "context_graph/ingestion/commit_indexing.py",
    "context_graph/ingestion/driver.py",
    "context_graph/ingestion/hosted_indexing.py",
    "context_graph/ingestion/models.py",
    "context_graph/ingestion/repo_cache.py",
    "context_graph/ingestion/snapshot_builder.py",
    "context_graph/ingestion/temporal.py",
    "context_graph/ingestion/git/github_client.py",
    "context_graph/ingestion/git/github_indexer.py",
    "context_graph/ingestion/git/structural_planner.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
