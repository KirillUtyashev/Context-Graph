[project]
name = "context-graph"
version = "0.1.0"
requires-python = ">=3.10,<4"
dependencies = [
    # Graph backends
    "neo4j>=5.22,<6",
    "langchain-aws>=0.2,<1",
    "opensearch-py>=2.7,<3",
    # Metadata backend
    "psycopg[binary]>=3.2,<4",
    # AWS
    "boto3>=1.39,<2",
    # LLM / embeddings
    "openai>=1.91,<2",
    "tenacity>=9,<10",
    # Runtime
    "pydantic>=2.11,<3",
    "numpy>=1,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["context_graph"]

[tool.uv.workspace]
members = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["context_graph"]

[tool.coverage.report]
show_missing = true
